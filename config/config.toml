[tools]
go = "latest"
node = "latest"
python = "latest"
rust = "latest"

[settings.history]
sync = "manual"

[dotfiles]
"~/.bin" = { mode = "track" }
"~/.config/ghostty" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/starship.toml" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"

[bootstrap.packages]
"brew:ripgrep" = { os = ["macos"] }
"brew:fd" = { os = ["macos"] }
"brew:bat" = { os = ["macos"] }
"brew:eza" = { os = ["macos"] }
"brew:fzf" = { os = ["macos"] }
"brew:zoxide" = { os = ["macos"] }
"brew:jq" = { os = ["macos"] }
"brew:gh" = { os = ["macos"] }
"brew:lazygit" = { os = ["macos"] }
"brew:neovim" = { os = ["macos"] }
"brew:starship" = { os = ["macos"] }
"brew:tmux" = { os = ["macos"] }
"brew:bottom" = { os = ["macos"] }
"brew:just" = { os = ["macos"] }
"brew-cask:bitwarden" = {os = ["macos"]}
"brew-cask:ghostty" = { os = ["macos"] }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = ["macos"] }
"brew-cask:obsidian" = { os = ["macos"] }
"brew:anomalyco/tap/opencode" = {os = ["macos"]}

"pacman:ripgrep" = { os = ["linux"] }
"pacman:fd" = { os = ["linux"] }
"pacman:bat" = { os = ["linux"] }
"pacman:eza" = { os = ["linux"] }
"pacman:fzf" = { os = ["linux"] }
"pacman:zoxide" = { os = ["linux"] }
"pacman:jq" = { os = ["linux"] }
"pacman:github-cli" = { os = ["linux"] }
"pacman:lazygit" = { os = ["linux"] }
"pacman:neovim" = { os = ["linux"] }
"pacman:starship" = { os = ["linux"] }
"pacman:tmux" = { os = ["linux"] }
"pacman:bottom" = { os = ["linux"] }
"pacman:just" = { os = ["linux"] }
"pacman:zsh" = { os = ["linux"] }
"pacman:ttf-jetbrains-mono-nerd" = { os = ["linux"] }


[bootstrap.macos.defaults."NSGlobalDomain"]

# Appearance
AppleInterfaceStyle = "Dark"

# Typing
NSAutomaticCapitalizationEnabled = false
NSAutomaticSpellingCorrectionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false

# Scrolling
AppleMomentumScrollSupported = true

# Save/open dialogs
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true

# File extensions
AppleShowAllExtensions = true

# Units / measurements
AppleMeasurementUnits = "Inches"
AppleMetricUnits = false

# Window behavior
NSWindowShouldDragOnGesture = true


[bootstrap.macos.dock]
autohide = true
autohide_delay = 0
autohide_time_modifier = 0.5
orientation = "bottom"
tilesize = 16
magnification = true
largesize = 64
mru_spaces = false
apps = [
	"/Applications/Ghostty.app",
	"/Applications/Helium.app",
  "/Applications/Obsidian.app"
]

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"
sort_folders_first = true

[bootstrap.macos.keyboard]
automatic_capitalization = false
automatic_spelling_correction = false
fn_state = true
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false


[tasks.bootstrap]
run = "command -v pnpm >/dev/null 2>&1 || npx get-pnpm"
